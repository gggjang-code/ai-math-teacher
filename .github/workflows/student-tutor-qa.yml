name: Student tutor code QA

on:
  pull_request:
  push:
    branches:
      - fix/student-tutor-reliability-20261126

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q app.py student_store.py tests
      - name: Storage unit tests
        run: python -m unittest discover -s tests -v
